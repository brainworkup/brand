# ============================================================================
# Concept 1: "Growing Minds" — Warm & Supportive
# ============================================================================
# Tone: Reassuring, parent-facing, approachable clinical
# Best for: Private clients (parents), school referrals
# Name: Brainworkup Neuropsychology
# Tagline: Understanding every mind at every stage
# ============================================================================

meta:
  name:
    full: "Brainworkup Neuropsychology"
    short: "Brainworkup"
  link:
    home: https://brainworkup.org
    github: https://github.com/brainworkup

# Logo images disabled - Typst has path resolution issues with nested directories
# and automatically applies logos as page backgrounds, causing absolute path errors.
# If logo display is needed, add manually via include-in-header instead.
# logo:
#   images:
#     logo-light: logos/logo-transparent.png
#     logo-dark: logos/logo-transparent.png
#   medium: logo-light
#   large: logo-light

color:
  palette:
    # Primary: warm teal — calming, clinical, but not cold
    teal: "#2A9D8F"
    teal-light: "#5FC4B8"
    teal-dark: "#1E7A6E"
    # Accent: warm coral — inviting, nurturing, pediatric-friendly
    coral: "#E07A5F"
    coral-light: "#F0A08A"
    coral-dark: "#C4583F"
    # Neutrals: soft, warm
    cream: "#FAF3E0"
    sand: "#F0E6CE"
    charcoal: "#264653"
    charcoal-light: "#3D6373"
    slate: "#4A6670"
    white: "#FEFEFE"
    black: "#1A2026"
  foreground: charcoal
  background: cream
  primary: teal
  secondary: coral
  tertiary: charcoal-light
  success: "#4CAF50"
  info: teal-light
  warning: "#F4A261"
  danger: coral-dark
  light: cream
  dark: charcoal

typography:
  fonts:
    # Nunito: rounded, warm, approachable — but still professional
    - family: Nunito
      source: google
      weight: [300, 400, 600, 700]
      style: [normal, italic]
      display: swap
    # Lora: elegant serif for body — warm, readable, clinical
    - family: Lora
      source: google
      weight: [400, 500, 600, 700]
      style: [normal, italic]
      display: swap
    # JetBrains Mono: clean monospace for any code/data references
    - family: JetBrains Mono
      source: google
      weight: [400, 500]
      style: normal
      display: swap
  base:
    family: Lora
    size: 17px
    weight: 400
    line-height: 1.7
  headings:
    family: Nunito
    weight: 700
    line-height: 1.3
    style: normal
    color: charcoal
  monospace:
    family: JetBrains Mono
    size: 0.85em
    weight: 400
  monospace-inline:
    family: JetBrains Mono
    size: 0.85em
    weight: 400
    color: teal-dark
    background-color: sand
  monospace-block:
    family: JetBrains Mono
    size: 0.9em
    weight: 400
    color: charcoal
    background-color: sand
    line-height: 1.5
  link:
    weight: 400
    color: teal
    decoration: underline

defaults:
  bootstrap:
    defaults:
      brand-teal: "$brand-teal"
      brand-coral: "$brand-coral"
